services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: dp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: aware_db
      MYSQL_USER: aware_user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dp-network

  # Digital Phenotyping Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dp-backend
    ports:
      - "8080"
      - "8081"
    environment:
      DATABASE_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./aware-config.json:/app/aware-config.json:ro
    networks:
      - dp-network
    restart: unless-stopped


  # Signature engine service (hourly features + signature alerts)
  signature_engine:
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: signature-engine-service
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: "3306"
      DB_NAME: aware_db
      DB_USER: aware_user
      DB_PASSWORD: password
      PYTHONUNBUFFERED: "1"
      LOOP_INTERVAL_SEC: "60"
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - dp-network
    restart: unless-stopped
    command: ["python", "-u", "/app/build_hourly_features_and_alerts.py", "--loop"]

volumes:
  mysql_data:

networks:
  dp-network:
    driver: bridge
